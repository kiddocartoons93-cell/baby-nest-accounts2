name: Build BABY NEST Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir android-src
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d android-src

      - name: Find Android project
        run: |
          SETTINGS=$(find android-src -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android settings file not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BABY-NEST-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
